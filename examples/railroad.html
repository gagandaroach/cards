<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Railroad</title>
  <style>
    @page { size: letter landscape; margin: 0.5in; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fff; color: #1b1b3a; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { font-family: Georgia, 'Times New Roman', serif; padding: 0.5in; }
    @media print { body { padding: 0; } .hint { display: none; } }
    .stripes { display: flex; flex-direction: column; height: 0.24in; border: 1px solid #000080; margin-bottom: 0.12in; }
    .stripes i { flex: 1; }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.2in; }
    h1 { font-size: 28pt; margin: 0; color: #000080; }
    .date { font-size: 14pt; }
    .date span { display: inline-block; width: 2.2in; border-bottom: 1.5px solid #000080; }
    .sheet { position: relative; isolation: isolate; }
    .watermark { position: absolute; z-index: -1; inset: 0; margin: auto; width: 4.5in; height: 4.5in; opacity: 0.08; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { border: 1.5px solid #000080; text-align: center; }
    thead th { height: 0.65in; font-size: 16pt; background: #ffd9b0; color: #000080; }
    th.round { width: 0.9in; font-size: 16pt; background: #fff3e6; }
    thead th.round { background: #ffd9b0; }
    tbody td, tbody th { height: 0.34in; }
    tfoot th, tfoot td { height: 0.6in; border-top: 4px double #000080; background: #d7eed2; }
    tfoot th.round { background: #d7eed2; color: #0b5d04; }
    th.corner { font-size: 12pt; }
    .hint { font-family: system-ui, sans-serif; color: #666; font-size: 11pt; margin-top: 0.2in; }
  </style>
</head>
